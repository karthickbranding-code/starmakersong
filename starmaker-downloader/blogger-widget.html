<!--
  BLOGGER WIDGET
  Where to paste:
    - Layout > Add a Gadget > "HTML/JavaScript", or
    - A post/page in "HTML view" (not Compose view).
  Before pasting, change API_BASE (near the bottom) to your hosted backend URL.
  The backend does the real work; Blogger only shows this form.
-->
<div id="smdl">
  <style>
    #smdl { max-width: 640px; margin: 0 auto; padding: 20px; box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
      color: #f2effd; background: #1a1633; border: 1px solid #342d62; border-radius: 16px; }
    #smdl * { box-sizing: border-box; }
    #smdl h3 { margin: 0 0 4px; font-size: 1.3rem; color: #f2effd; }
    #smdl .smdl-sub { margin: 0 0 16px; color: #a9a3c9; font-size: .92rem; }
    #smdl .smdl-row { display: flex; gap: 10px; }
    #smdl input[type="url"] { flex: 1; min-width: 0; padding: 12px; font-size: 1rem; color: #f2effd;
      background: #241e48; border: 1px solid #342d62; border-radius: 10px; outline: none; margin: 0; }
    #smdl button { padding: 12px 18px; font-size: 1rem; font-weight: 700; color: #fff; cursor: pointer;
      border: 0; border-radius: 10px; background: linear-gradient(135deg, #a855f7, #ec4899); margin: 0; }
    #smdl button:disabled { opacity: .6; cursor: wait; }
    #smdl label.smdl-check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px;
      font-size: .88rem; color: #a9a3c9; cursor: pointer; }
    #smdl label.smdl-check input { margin-top: 3px; flex: none; }
    #smdl .smdl-err { margin: 12px 0 0; padding: 10px 12px; color: #fca5a5; font-size: .9rem;
      background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.35); border-radius: 10px; }
    #smdl .smdl-res { margin-top: 16px; padding-top: 16px; border-top: 1px solid #342d62; }
    #smdl .smdl-res img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
    #smdl .smdl-res h4 { margin: 0 0 10px; font-size: 1.05rem; color: #f2effd; overflow-wrap: anywhere; }
    #smdl .smdl-dl { display: inline-block; margin: 0 8px 8px 0; padding: 10px 16px; font-weight: 700;
      color: #fff !important; text-decoration: none !important; border-radius: 10px;
      background: linear-gradient(135deg, #a855f7, #ec4899); }
    #smdl .smdl-note { margin: 16px 0 0; font-size: .75rem; color: #7f78a8; text-align: center; }
    #smdl [hidden] { display: none !important; }
    @media (max-width: 480px) { #smdl .smdl-row { flex-direction: column; } #smdl button { width: 100%; } }
  </style>

  <h3>StarMaker Recording Downloader</h3>
  <p class="smdl-sub">Save your own recordings as audio or video.</p>

  <form id="smdl-form" novalidate>
    <div class="smdl-row">
      <input id="smdl-url" type="url" placeholder="Paste your StarMaker share link" autocomplete="off">
      <button id="smdl-go" type="submit">Get file</button>
    </div>
    <label class="smdl-check">
      <input id="smdl-agree" type="checkbox">
      <span>This is my own recording, or the singer gave me permission to save it.</span>
    </label>
    <p id="smdl-err" class="smdl-err" hidden></p>
  </form>

  <div id="smdl-res" class="smdl-res" hidden>
    <img id="smdl-thumb" alt="" hidden>
    <h4 id="smdl-title"></h4>
    <div id="smdl-formats"></div>
  </div>

  <p class="smdl-note">Only download recordings you own or have permission to save. Not affiliated with StarMaker.</p>

  <script>
    (function () {
      // >>> CHANGE THIS to your hosted backend URL (no trailing slash) <<<
      var API_BASE = "https://YOUR-BACKEND.onrender.com";

      var $ = function (id) { return document.getElementById(id); };
      var form = $("smdl-form"), urlIn = $("smdl-url"), agree = $("smdl-agree"), go = $("smdl-go"),
          err = $("smdl-err"), res = $("smdl-res"), thumb = $("smdl-thumb"),
          title = $("smdl-title"), formats = $("smdl-formats");

      function showErr(m) { err.textContent = m; err.hidden = false; }
      function busy(on) { go.disabled = on; go.textContent = on ? "Fetching..." : "Get file"; }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.hidden = true; res.hidden = true;
        var url = urlIn.value.trim();
        if (!url) { showErr("Please paste your recording link."); return; }
        if (!agree.checked) { showErr("Please tick the box to confirm you can save this recording."); return; }

        busy(true);
        fetch(API_BASE + "/api/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url, confirm: true })
        })
          .then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) {
              if (!r.ok) throw new Error(d.error || "Something went wrong. Please try again.");
              return d;
            });
          })
          .then(function (d) {
            title.textContent = d.title || "Recording";
            if (d.thumbnail) { thumb.src = d.thumbnail; thumb.hidden = false; } else { thumb.hidden = true; }
            formats.textContent = "";
            d.formats.forEach(function (f) {
              var a = document.createElement("a");
              a.className = "smdl-dl";
              a.href = API_BASE + f.download_url;
              a.textContent = "Download " + f.label;
              formats.appendChild(a);
            });
            res.hidden = false;
          })
          .catch(function (ex) { showErr(ex.message || "Network error. Please try again."); })
          .then(function () { busy(false); });
      });
    })();
  </script>
</div>
